; UnivoChat — upload limits for hosts running PHP as FastCGI / FPM / LiteSpeed.
;
; The .htaccess php_value block beside this file covers Apache's mod_php; those
; servers ignore this file, and these servers ignore that block. Keeping both in
; step is the price of the app running on XAMPP locally and on a LiteSpeed host
; in production without a per-environment build step.
;
; The 50 MB attachment ceiling itself lives in config/config.php
; (MAX_FILE_SIZE / MAX_DOC_SIZE). These are what let a 50 MB request reach it.
;
; Note: max_file_uploads is PHP_INI_SYSTEM and cannot be set from here at all,
; which is exactly why the client sends large batches as several requests —
; see batchFiles() in assets/js/app.js.

upload_max_filesize = 52M
post_max_size       = 56M
max_input_time      = 300
max_execution_time  = 300
